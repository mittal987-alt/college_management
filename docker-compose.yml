version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: college_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./academics_handbook.pdf:/app/academics_handbook.pdf:ro
      - ./fee_structure.pdf:/app/fee_structure.pdf:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://localhost:3000

  frontend:
    build:
      context: ./frontend
    container_name: college_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend